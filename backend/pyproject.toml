[project]
name = "medscribe-backend"
version = "0.1.0"
description = "MedScribe AI backend: FastAPI service for clinical documentation automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.14",
    "starlette==0.46.2",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.4.0",
    "python-multipart==0.0.32",
    "celery==5.4.0",
    "redis==5.2.1",
    "sentence-transformers==3.3.1",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "cryptography==44.0.1",
    "faster-whisper==1.1.0",
    "openpyxl==3.1.5",
    "sentry-sdk[fastapi]==2.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "black==24.10.0",
    "isort==5.13.2",
    "websockets==17.1",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: downloads model weights or otherwise takes longer than the rest of the suite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
