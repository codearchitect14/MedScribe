name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medscribe
          POSTGRES_PASSWORD: medscribe
          POSTGRES_DB: medscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://medscribe:medscribe@localhost:5432/medscribe
      SYNC_DATABASE_URL: postgresql+psycopg2://medscribe:medscribe@localhost:5432/medscribe
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-for-production
      CSRF_SECRET: ci-only-secret-not-for-production
      # A fixed, non-secret Fernet key: fine for CI (throwaway ephemeral DB), never reuse for a real deployment.
      FIELD_ENCRYPTION_KEY: X8excZ8nsRxWtaTS4mSrxIsozIr9nFZY0nJafndbTGA=
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" --python .venv

      - name: Lint (unused imports/names)
        working-directory: backend
        run: .venv/bin/python -m ruff check app tests --select F401,F811,F841

      - name: Run migrations
        working-directory: backend
        run: .venv/bin/python -m alembic upgrade head

      - name: Load reference codes (needed by pgvector coding tests)
        working-directory: backend
        run: .venv/bin/python -m scripts.load_reference_codes

      - name: Run tests (fast suite - excludes tests that download the Whisper model)
        working-directory: backend
        run: .venv/bin/python -m pytest tests/ -m "not slow" --cov=app --cov-report=term-missing

      - name: Dependency audit
        working-directory: backend
        run: |
          uv pip install pip-audit --python .venv
          .venv/bin/python -m pip_audit || true # informational: see docs/security-audit.md for triage, not a hard CI gate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
